name: "Slider CI"

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    # Swift 6.4 ships with Xcode 27, which GitHub only provides on the dedicated
    # xcode-27 image for now; macos-latest still tops out at Xcode 26.
    runs-on: xcode-27
    defaults:
      run:
        # Without pipefail a failing xcodebuild is hidden by whatever it is piped into,
        # which is how this workflow used to report success while building nothing.
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Require Xcode 27
        run: |
          version=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          echo "Xcode $version"
          if [[ "${version%%.*}" != "27" ]]; then
            echo "::error::Package.swift needs Swift 6.4 (Xcode 27), but the runner provides Xcode $version"
            exit 1
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Pick a simulator
        id: simulator
        run: |
          destination=$(python3 Scripts/select_simulator.py)
          echo "Using $destination"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      - name: Build framework
        run: |
          xcodebuild build \
            -project Slider.xcodeproj \
            -scheme Slider \
            -destination "${{ steps.simulator.outputs.destination }}" \
            SWIFT_STRICT_CONCURRENCY=complete \
            -quiet

      - name: Run tests
        run: |
          xcodebuild test \
            -project Slider.xcodeproj \
            -scheme SliderTests \
            -destination "${{ steps.simulator.outputs.destination }}"

      - name: Build example app
        run: |
          xcodebuild build \
            -project Slider.xcodeproj \
            -scheme Slider_Example \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -quiet

  spm:
    name: Swift Package Manager manifest
    # Swift 6.4 ships with Xcode 27, which GitHub only provides on the dedicated
    # xcode-27 image for now; macos-latest still tops out at Xcode 26.
    runs-on: xcode-27
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Require Xcode 27
        run: |
          version=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          echo "Xcode $version"
          if [[ "${version%%.*}" != "27" ]]; then
            echo "::error::Package.swift needs Swift 6.4 (Xcode 27), but the runner provides Xcode $version"
            exit 1
          fi

      # The library is iOS-only, so the package cannot be built on the runner itself;
      # this keeps Package.swift honest for consumers that depend on it via SwiftPM.
      - name: Validate manifest
        run: swift package dump-package > /dev/null
