name: "Slider CI"

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        destination:
          - "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest"
    steps:
      - uses: actions/checkout@v4

      - name: Build framework
        run: |
          xcodebuild build \
            -project Slider.xcodeproj \
            -scheme Slider \
            -destination "${{ matrix.destination }}" \
            SWIFT_STRICT_CONCURRENCY=complete \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Run tests
        run: |
          xcodebuild test \
            -project Slider.xcodeproj \
            -scheme SliderTests \
            -destination "${{ matrix.destination }}" \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Build example app
        run: |
          xcodebuild build \
            -project Slider.xcodeproj \
            -scheme Slider_Example \
            -destination "${{ matrix.destination }}" \
            | xcpretty || exit ${PIPESTATUS[0]}

  spm:
    name: Swift Package Manager manifest
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      # The library is iOS-only, so the package cannot be built on the runner itself;
      # this keeps Package.swift honest for consumers that depend on it via SwiftPM.
      - name: Validate manifest
        run: swift package dump-package > /dev/null
